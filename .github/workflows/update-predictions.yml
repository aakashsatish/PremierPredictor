name: Update predictions

# Tuesday mornings: late enough that football-data has published the
# weekend's statistics and odds, which it does on a day or two of lag.
# Running on Sunday night would collect fbref results but miss those.
on:
  schedule:
    - cron: "0 9 * * 2"   # 09:00 UTC Tuesday
  workflow_dispatch:       # also runnable by hand from the Actions tab

# Needed so the job can push the refreshed predictions back.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh results and regenerate predictions
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          if [ -z "$SCRAPERAPI_KEY" ]; then
            echo "SCRAPERAPI_KEY secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python update.py

      - name: Commit refreshed predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.csv data/fixtures.csv \
                  data/predictions_*.csv predictions_*.txt
          if git diff --staged --quiet; then
            echo "No change this week - nothing to commit."
          else
            git commit -m "Refresh predictions ($(date -u +%Y-%m-%d))"
            git push
          fi
